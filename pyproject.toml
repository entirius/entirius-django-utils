[project]
name = "entirius-django-utils"
version = "2.0.1"
description = "Shared Django utilities for Volkanos services - base models, DRF API helpers, admin and text tools"
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "django>=4.2",
    "djangorestframework>=3.14",
    "django-filter>=23.5",
    "marshmallow>=3.19",
    "webargs>=8.3",
    "beautifulsoup4>=4.12",
    "pydantic>=2.0",
    "python-slugify>=8.0",
    "celery-once>=3.0",
    "entirius-py-idx-normalizator>=2.0.0",
    "entirius-py-process-logger>=2.0.0",
    "entirius-django-regional>=2.0.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest", "pytest-django"]
unfold = ["django-unfold"]

[project.urls]
Repository = "https://github.com/entirius/entirius-django-utils"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_utils"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105"]
# Legacy migrated 1:1 - deferred cleanup:
"src/django_utils/api/decorators.py" = ["B012"]
"src/django_utils/tools/__init__.py" = ["F403"]
"src/django_utils/tools/t9n.py" = ["C419"]
"src/django_utils/tools/text.py" = ["UP031"]

[tool.ruff.lint.isort]
known-first-party = ["django_utils"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]

[tool.deptry.package_module_name_map]
django-unfold = "unfold"

[tool.deptry.per_rule_ignores]
# django_captcha: optional integration (try/except no-op fallback); module not public yet
DEP001 = ["django_captcha"]

